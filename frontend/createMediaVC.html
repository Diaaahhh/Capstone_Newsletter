<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Media - East West University</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="categoryPages.css" />
    <link rel="stylesheet" href="createMediaVC.css" />
    <link rel="stylesheet" href="majorEvents.css">
    <script src="alertModal.js"></script>
    <link rel="stylesheet" href="homepage.css" />
</head>

  <body class="create-media-page">
    <script>
      if (!localStorage.getItem("isLoggedIn")) {
        window.location.href = "loginPage.html";
      }
    </script>

    <!-- Header -->
    <header class="header">
      <div class="container-fluid">
        <div class="row align-items-center">
          <div class="col-md-6">
            <div class="logo">
              <a href="homepage.html"><img
                src="Images/logo.png"
                alt="East West University"
                class="header-logo"/></a>
            </div>
          </div>
          <div class="col-md-6">
            <div class="header-right">
              <nav class="header-nav">
                <a href="homepage.html" class="nav-link">Home</a>
                <a href="#" class="nav-link notification-link">
                  Notification
                  <span class="notification-badge">2</span>
                </a>
                <a href="printPage.html" class="nav-link">Prints</a>
                <a href="vcNewsletter.html" class="nav-link">VC Newsletter</a>
                <div class="user-dropdown">
                  <button type="button" class="user-btn" id="userBtn">
                <i class="bi bi-person-circle"></i>
              </button>
                  <div class="dropdown-menu" id="dropdownMenu">
                    <a href="profile.html" class="dropdown-item">
                      <i class="bi bi-person"></i> View Profile
                    </a>
                    <a
                      href="loginPage.html"
                      class="dropdown-item"
                      id="logoutLink"
                    >
                      <i class="bi bi-box-arrow-right"></i> Logout
                    </a>
                  </div>
                </div>
              </nav>
              <div class="search-container">
                <i class="bi bi-search search-icon"></i>
                <input
                  type="text"
                  class="search-input"
                  placeholder="Search..."
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Title -->
    <div class="page-title-bar">
      <div class="container-fluid">
        <h1 class="page-title">Create Media</h1>
      </div>
    </div>

   <!-- Main Content Area -->
    <div class="main-container">

      <!-- Back Button -->
      <button
        type="button"
        class="btn btn-secondary back-btn"
        onclick="window.location.href='mediaVC.html'"
      >
        <i class="bi bi-arrow-left-circle"></i>
      </button>

      <!-- Main Content -->
      <main class="main-content">
        <div class="form-container">
          <form id="createMediaForm" novalidate>
            <div class="form-section">
              <h2 class="section-title">Media Details</h2>

              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label">Name *</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="e.g., Dr. Ashik Mosaddik"
                    required
                  />
                </div>
              </div>

              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label">Web Link</label>
                  <input
                    type="url"
                    class="form-control"
                    id="webLink"
                    placeholder="e.g., https://www.jamuna.tv/news/xxxx"
                  />
                </div>
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Photo</label>
                  <input
                    type="file"
                    class="form-control"
                    id="photo"
                    accept="image/*"
                  />
                </div>
              </div>

              <div class="row">
                <div class="col-md-12 mb-3">
                  <label class="form-label">Text</label>
                  <textarea
                    class="form-control"
                    id="harvardRef"
                    rows="5"
                    placeholder='e.g., Dr. Ashik Mosaddik was present as a Special Guest at “Shokaler Bangladesh,” Jamuna TV on 21 May 2024 on the occasion of World Meditation Day.'
                  ></textarea>
                </div>
              </div>
            </div>

            <!-- Actions -->
            <div class="form-actions">
              <button type="button" class="btn btn-outline-primary draft-btn">
                <i class="bi bi-file-earmark-text"></i> Save as Draft
              </button>
              <button type="submit" class="btn btn-primary create-btn">
                <i class="bi bi-check-circle"></i> Submit for Review
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="imageUploadHelper.js"></script>
    <script src="submissionViewHelper.js"></script>
    <script src="toast.js"></script>
    <script src="createMediaVC.js"></script>
    <script src="majorEvents.js"></script>
    <script src="notification.js"></script>
    <script src="submission.js"></script>
  <script src="profileDropdown.js"></script>
</body>
</html>
